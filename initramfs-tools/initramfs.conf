# Display mode inside the initramfs.
#
#   run   keep showing codes until the disk is unlocked (default)
#   once  print a single code and carry on booting
#
# 'run' refreshes once per 30-second TOTP window. It writes to the console the
# passphrase prompt also uses, so the prompt scrolls; typing is unaffected.
TPM2_KIRA_INITRAMFS_MODE=run
