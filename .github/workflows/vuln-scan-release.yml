# .github/workflows/vuln-scan-release.yml
name: Vulnerability Scan (Released Binary)

on:
  schedule:
    - cron: '0 4 * * *' 
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # for SARIF upload to Security tab

    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Download latest release binary
        run: |
          gh release download \
            --repo ${{ github.repository }} \
            --pattern "tpm2-kira-linux-amd64" \
            --dir ./bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make binary executable
        run: chmod +x ./bin/tpm2-kira-linux-amd64

      - name: Scan binary for vulnerabilities (SARIF)
        run: |
          govulncheck -mode binary -format sarif \
            ./bin/tpm2-kira-linux-amd64 > govulncheck.sarif 2>&1 || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck-binary

      - name: Scan binary (human-readable log)
        run: |
          govulncheck -mode binary ./bin/tpm2-kira-linux-amd64
        continue-on-error: true
