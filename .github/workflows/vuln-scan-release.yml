name: Vulnerability Scan (Released Binary)

on:
  schedule:
    - cron: '0 4 * * *'  # Every day at 8:00 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Download latest release binary
        run: |
          gh release download \
            --repo ${{ github.repository }} \
            --pattern "tpm2-kira-linux-amd64" \
            --dir ./bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make binary executable
        run: chmod +x ./bin/tpm2-kira-linux-amd64

      - name: Scan binary for vulnerabilities
        run: govulncheck -mode binary ./bin/tpm2-kira-linux-amd64
