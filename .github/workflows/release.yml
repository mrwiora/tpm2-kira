name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build binaries for Linux platforms
        run: |
          # Create dist directory
          mkdir -p dist

          # Get version for ldflags
          VERSION=${{ steps.get_version.outputs.VERSION }}
          LDFLAGS="-s -w -X main.Version=${VERSION}"

          # Build for Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/tpm2-kira-linux-amd64 .

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Upload artifacts to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}

          # Check if release exists
          if gh release view ${VERSION} >/dev/null 2>&1; then
            echo "Release ${VERSION} exists, uploading artifacts..."

            # Upload artifacts to existing release
            gh release upload ${VERSION} dist/tpm2-kira-linux-amd64 --clobber
            gh release upload ${VERSION} dist/checksums.txt --clobber

            echo "Artifacts uploaded to existing release ${VERSION}"
          else
            echo "Release ${VERSION} does not exist, creating new release..."

            # Create release command
            RELEASE_CMD="gh release create ${VERSION} --title \"Release ${VERSION}\""

            # Add prerelease flag if version contains dash
            if [[ "$VERSION" == *"-"* ]]; then
              RELEASE_CMD="$RELEASE_CMD --prerelease"
            fi

            # Add Linux binaries and checksums
            RELEASE_CMD="$RELEASE_CMD dist/tpm2-kira-linux-amd64"
            RELEASE_CMD="$RELEASE_CMD dist/checksums.txt"

            # Execute the command
            eval $RELEASE_CMD

            echo "New release ${VERSION} created with artifacts"
          fi
