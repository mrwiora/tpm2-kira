name: Release

on:
  push:
    tags:
      - "*"

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      version_clean: ${{ steps.get_version.outputs.VERSION_CLEAN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_CLEAN=${VERSION#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_CLEAN=${VERSION_CLEAN}" >> $GITHUB_OUTPUT

      - name: Build binaries for Linux platforms
        run: |
          # Create dist directory
          mkdir -p dist

          # Get version for ldflags
          VERSION=${{ steps.get_version.outputs.VERSION }}
          LDFLAGS="-s -w -X main.Version=${VERSION}"

          # Build for Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/tpm2-kira-linux-amd64 .

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/tpm2-kira-linux-amd64
            dist/checksums.txt
          retention-days: 1

  build-archlinux:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: read

    steps:
      - name: Update system and install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git go namcap pacman-contrib

      - name: Create build user
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix ownership for build user
        run: |
          chown -R builder:builder .

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_CLEAN=${VERSION#v}
          # An Arch pkgver may not contain '-', but a prerelease tag can.
          PKGVER=${VERSION_CLEAN//-/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_CLEAN=${VERSION_CLEAN}" >> $GITHUB_OUTPUT
          echo "PKGVER=${PKGVER}" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD version and checksums
        run: |
          cd packaging/aur
          PKGVER=${{ steps.get_version.outputs.PKGVER }}
          TAG=${{ steps.get_version.outputs.VERSION }}

          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
          sed -i "s|^_tag=.*|_tag=${TAG}|" PKGBUILD

          grep -q "^pkgver=${PKGVER}$" PKGBUILD || { echo "ERROR: pkgver not set"; exit 1; }
          grep -q "^_tag=${TAG}$" PKGBUILD || { echo "ERROR: _tag not set"; exit 1; }

          # Replaces the SKIP placeholder with the real tarball hash.
          chown builder:builder .
          sudo -u builder updpkgsums
          grep -q "SKIP" PKGBUILD && { echo "ERROR: sha256sums still SKIP"; exit 1; }

          cat PKGBUILD

      - name: Build package
        run: |
          cd packaging/aur
          sudo -u builder makepkg --noconfirm --syncdeps --rmdeps --clean
          if ! ls *.pkg.tar.zst >/dev/null 2>&1; then
            echo "ERROR: No package file was created"
            exit 1
          fi

      - name: Check package with namcap
        run: |
          cd packaging/aur
          namcap PKGBUILD *.pkg.tar.zst | tee namcap.log
          if grep -q '^.*E: ' namcap.log; then
            echo "ERROR: namcap reported errors"
            exit 1
          fi

      - name: Validate package contents
        run: |
          cd packaging/aur
          PKGVER=${{ steps.get_version.outputs.PKGVER }}

          # Find the main package (not debug package)
          MAIN_PACKAGE=$(ls tpm2-kira-*.pkg.tar.zst | grep -v debug | head -1)
          if [[ -z "$MAIN_PACKAGE" ]]; then
            echo "ERROR: No main package found"
            ls -la *.pkg.tar.zst
            exit 1
          fi

          # The previous PKGBUILD could silently emit 0.0.0; never again.
          case "$MAIN_PACKAGE" in
            tpm2-kira-${PKGVER}-*) ;;
            *) echo "ERROR: ${MAIN_PACKAGE} does not carry version ${PKGVER}"; exit 1 ;;
          esac

          echo "Validating package: $MAIN_PACKAGE"
          mkdir -p /tmp/package-test
          tar -xf "$MAIN_PACKAGE" -C /tmp/package-test

          for path in \
            usr/bin/tpm2-kira \
            usr/lib/systemd/system/tpm2-kira.service \
            usr/lib/initcpio/install/sd-tpm2-kira \
            usr/lib/initcpio/post/sd-tpm2-kira
          do
            if [[ ! -e "/tmp/package-test/${path}" ]]; then
              echo "ERROR: ${path} missing from the package"
              exit 1
            fi
          done

          if [[ ! -x "/tmp/package-test/usr/bin/tpm2-kira" ]]; then
            echo "ERROR: tpm2-kira binary not executable"
            exit 1
          fi

          # The unit must NOT be enabled on the host; the hook enables it in the image.
          if [[ -e "/tmp/package-test/usr/lib/systemd/system/sysinit.target.wants/tpm2-kira.service" ]]; then
            echo "ERROR: package force-enables tpm2-kira.service on the host"
            exit 1
          fi

          "/tmp/package-test/usr/bin/tpm2-kira" version

      - name: Create package checksum
        run: |
          cd packaging/aur
          # Only checksum the main package, not debug packages
          sha256sum tpm2-kira-*.pkg.tar.zst | grep -v debug > package-checksums.txt || sha256sum tpm2-kira-*.pkg.tar.zst > package-checksums.txt

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-package
          path: |
            packaging/aur/tpm2-kira-[0-9]*.pkg.tar.zst
            packaging/aur/package-checksums.txt
            packaging/aur/PKGBUILD
          retention-days: 1

  build-debian:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    permissions:
      contents: read

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates debhelper dpkg-dev git golang-go lintian xz-utils

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The package must build with the Go the distro actually ships, not a
      # newer toolchain from setup-go, or CI proves nothing about installability.
      - name: Record the distro toolchain
        run: |
          go version
          dpkg-query -W -f='golang-go ${Version}\n' golang-go
          echo "go directive in go.mod: $(awk '/^go /{print $2}' go.mod)"

      - name: Set package version from tag
        id: get_version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=${GITHUB_REF#refs/tags/}

          # Same mapping as a local 'make deb', so tagged and untagged builds
          # cannot drift apart. On a tag this yields the bare version.
          VERSION_DEB=$(packaging/deb-version.sh)

          sed -i "1s/^tpm2-kira (.*)/tpm2-kira (${VERSION_DEB})/" debian/changelog
          head -1 debian/changelog
          grep -q "^tpm2-kira (${VERSION_DEB})" debian/changelog || {
            echo "ERROR: could not set changelog version to ${VERSION_DEB}"
            exit 1
          }

          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_DEB=${VERSION_DEB}" >> $GITHUB_OUTPUT

      # Vendoring here is what makes the emitted source package build offline.
      - name: Vendor dependencies
        run: |
          go mod vendor
          test -f vendor/modules.txt

      - name: Build source and binary packages
        run: |
          dpkg-buildpackage -us -uc

      - name: Collect artifacts
        run: |
          mkdir -p debpkg
          cp ../tpm2-kira_*.deb ../tpm2-kira_*.dsc ../tpm2-kira_*.tar.xz debpkg/
          ls -la debpkg/

      - name: Run lintian
        run: |
          lintian --no-tag-display-limit ../tpm2-kira_*.changes || \
            echo "lintian findings above (non-fatal)"

      - name: Validate package contents
        run: |
          DEB=$(ls debpkg/tpm2-kira_*.deb | head -1)
          echo "Validating ${DEB}"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"

          for path in \
            ./usr/bin/tpm2-kira \
            ./usr/share/initramfs-tools/hooks/tpm2-kira \
            ./usr/share/initramfs-tools/scripts/init-premount/tpm2-kira \
            ./usr/share/initramfs-tools/scripts/init-bottom/tpm2-kira \
            ./etc/initramfs/post-update.d/tpm2-kira \
            ./etc/tpm2-kira/initramfs.conf
          do
            dpkg-deb -c "$DEB" | awk '{print $NF}' | grep -qx "$path" || {
              echo "ERROR: ${path} missing from the package"
              exit 1
            }
          done

          # The initramfs carries no libraries, so the binary must be static.
          mkdir -p /tmp/debcheck
          dpkg-deb -x "$DEB" /tmp/debcheck
          file /tmp/debcheck/usr/bin/tpm2-kira
          file /tmp/debcheck/usr/bin/tpm2-kira | grep -q "statically linked" || {
            echo "ERROR: the packaged binary is not statically linked"
            exit 1
          }
          test -x /tmp/debcheck/usr/share/initramfs-tools/hooks/tpm2-kira || {
            echo "ERROR: initramfs hook is not executable"
            exit 1
          }
          /tmp/debcheck/usr/bin/tpm2-kira version

      - name: Create package checksums
        run: |
          cd debpkg
          sha256sum tpm2-kira_* > debian-checksums.txt
          cat debian-checksums.txt

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: debpkg/
          retention-days: 1

  publish-aur:
    needs: [build-archlinux, release]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: read
    # Prereleases stay off AUR; it carries one current version per package.
    if: ${{ !contains(github.ref_name, '-') }}

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git openssh

      - name: Download the PKGBUILD that was actually built
        uses: actions/download-artifact@v4
        with:
          name: archlinux-package
          path: built/

      - name: Configure AUR SSH access
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "ERROR: AUR_SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi

          # Absolute paths only: ssh expands '~' from the passwd entry, not from
          # $HOME, and a container job sets HOME=/github/home. They disagree.
          install -d -m 700 /opt/aur-ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /opt/aur-ssh/key
          chmod 600 /opt/aur-ssh/key

          # Pinned, not scanned: ssh-keyscan trusts whatever answers on the day.
          cat > /opt/aur-ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          chmod 644 /opt/aur-ssh/known_hosts

          # Expect SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          ssh-keygen -lf /opt/aur-ssh/known_hosts

      - name: Publish to AUR
        run: |
          useradd -m builder
          TAG=${GITHUB_REF#refs/tags/}

          export GIT_SSH_COMMAND="ssh -i /opt/aur-ssh/key -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=/opt/aur-ssh/known_hosts -o StrictHostKeyChecking=yes"

          git clone ssh://aur@aur.archlinux.org/tpm2-kira.git aur-repo
          cd aur-repo

          # An AUR repository holds only these two files.
          cp ../built/PKGBUILD PKGBUILD
          chown -R builder:builder .
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

          PKGVER=$(awk -F' = ' '/^\tpkgver = /{print $2}' .SRCINFO)
          if [ "v${PKGVER}" != "$TAG" ] && [ "${PKGVER}" != "${TAG#v}" ]; then
            echo "ERROR: .SRCINFO pkgver '${PKGVER}' does not match tag '${TAG}'"
            exit 1
          fi

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add PKGBUILD .SRCINFO

          if git diff --cached --quiet; then
            echo "AUR is already up to date for ${TAG}; nothing to push."
            exit 0
          fi

          git commit -m "Update to ${TAG}"
          git push origin master
          echo "Published ${TAG} to AUR."

  release:
    needs: [build-binaries, build-archlinux, build-debian]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist/

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: archlinux-package
          path: archlinux/

      # Not 'debian/': that would collide with the packaging directory in the checkout.
      - name: Download Debian package artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: debpkg/

      - name: Get package filename
        id: package_info
        run: |
          # Get the main package filename (not debug package)
          PACKAGE_FILE=$(ls archlinux/tpm2-kira-*.pkg.tar.zst | grep -v debug | head -1 | xargs basename)
          if [[ -z "$PACKAGE_FILE" ]]; then
            # Fallback if no debug filtering needed
            PACKAGE_FILE=$(ls archlinux/tpm2-kira-*.pkg.tar.zst | head -1 | xargs basename)
          fi
          echo "PACKAGE_FILE=${PACKAGE_FILE}" >> $GITHUB_OUTPUT
          echo "Selected package: ${PACKAGE_FILE}"

          DEB_FILE=$(ls debpkg/tpm2-kira_*.deb | head -1 | xargs basename)
          DSC_FILE=$(ls debpkg/tpm2-kira_*.dsc | head -1 | xargs basename)
          SRC_FILE=$(ls debpkg/tpm2-kira_*.tar.xz | head -1 | xargs basename)
          for f in "$DEB_FILE" "$DSC_FILE" "$SRC_FILE"; do
            if [[ -z "$f" ]]; then
              echo "ERROR: a Debian artifact is missing"
              ls -la debpkg/
              exit 1
            fi
          done
          echo "DEB_FILE=${DEB_FILE}" >> $GITHUB_OUTPUT
          echo "DSC_FILE=${DSC_FILE}" >> $GITHUB_OUTPUT
          echo "SRC_FILE=${SRC_FILE}" >> $GITHUB_OUTPUT
          echo "Selected Debian package: ${DEB_FILE}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=${{ needs.build-binaries.outputs.version }}
          PACKAGE_FILE=${{ steps.package_info.outputs.PACKAGE_FILE }}
          DEB_FILE=${{ steps.package_info.outputs.DEB_FILE }}
          DSC_FILE=${{ steps.package_info.outputs.DSC_FILE }}
          SRC_FILE=${{ steps.package_info.outputs.SRC_FILE }}

          # Debug information
          echo "Working directory: $(pwd)"
          echo "Git status: $(git status --porcelain 2>/dev/null | wc -l) files"
          echo "Git remote: $(git remote -v 2>/dev/null || echo 'No remotes')"
          echo "GitHub repository: ${GH_REPO}"
          echo "VERSION: ${VERSION}"
          echo "PACKAGE_FILE: ${PACKAGE_FILE}"
          echo "Available files in dist/:"
          ls -la dist/ || echo "No dist directory"
          echo "Available files in archlinux/:"
          ls -la archlinux/ || echo "No archlinux directory"
          echo "Available files in debpkg/:"
          ls -la debpkg/ || echo "No debpkg directory"

          # Check if release exists
          if gh release view ${VERSION} --repo ${GH_REPO} >/dev/null 2>&1; then
            echo "Release ${VERSION} exists, uploading all artifacts..."

            # Upload binary artifacts
            gh release upload ${VERSION} dist/tpm2-kira-linux-amd64 --clobber --repo ${GH_REPO}
            gh release upload ${VERSION} dist/checksums.txt --clobber --repo ${GH_REPO}

            # Upload package artifacts
            gh release upload ${VERSION} archlinux/${PACKAGE_FILE} --clobber --repo ${GH_REPO}
            gh release upload ${VERSION} archlinux/package-checksums.txt --clobber --repo ${GH_REPO}

            # Upload Debian artifacts
            gh release upload ${VERSION} debpkg/${DEB_FILE} --clobber --repo ${GH_REPO}
            gh release upload ${VERSION} debpkg/${DSC_FILE} --clobber --repo ${GH_REPO}
            gh release upload ${VERSION} debpkg/${SRC_FILE} --clobber --repo ${GH_REPO}
            gh release upload ${VERSION} debpkg/debian-checksums.txt --clobber --repo ${GH_REPO}

          else
            echo "Creating new release ${VERSION}..."

            # Create release notes
            cat > release_notes.md <<EOF
          ## Release ${VERSION}

          ### Downloads

          #### Linux Binary
          - **Binary**: \`tpm2-kira-linux-amd64\`
          - **Usage**: Download, make executable, and run

          #### Arch Linux Package
          - **Package**: \`${PACKAGE_FILE}\`
          - **Installation**: \`sudo pacman -U ${PACKAGE_FILE}\`
          - **Dependencies**: tpm2-tools>=5.0, tpm2-tss>=3.0.0

          #### Debian Package
          - **Package**: \`${DEB_FILE}\` (built against Debian 13 "trixie")
          - **Installation**: \`sudo apt install ./${DEB_FILE}\`
          - **Source**: \`${DSC_FILE}\` + \`${SRC_FILE}\` (vendored, builds offline)

          ### Installation

          #### From Binary
          \`\`\`bash
          wget https://github.com/mrwiora/tpm2-kira/releases/download/${VERSION}/tpm2-kira-linux-amd64
          chmod +x tpm2-kira-linux-amd64
          sudo mv tpm2-kira-linux-amd64 /usr/local/bin/tpm2-kira
          \`\`\`

          #### Arch Linux
          \`\`\`bash
          wget https://github.com/mrwiora/tpm2-kira/releases/download/${VERSION}/${PACKAGE_FILE}
          sudo pacman -U ${PACKAGE_FILE}
          \`\`\`

          #### Debian 13
          \`\`\`bash
          wget https://github.com/mrwiora/tpm2-kira/releases/download/${VERSION}/${DEB_FILE}
          sudo apt install ./${DEB_FILE}
          sudo tpm2-kira setup
          sudo update-initramfs -u
          \`\`\`

          For build from source instructions, see README.md.
          EOF

            # Create release command
            RELEASE_CMD="gh release create ${VERSION} --title \"Release ${VERSION}\" --notes-file release_notes.md"

            # Add prerelease flag if version contains dash
            if [[ "$VERSION" == *"-"* ]]; then
              RELEASE_CMD="$RELEASE_CMD --prerelease"
            fi

            # Add all artifacts
            RELEASE_CMD="$RELEASE_CMD dist/tpm2-kira-linux-amd64"
            RELEASE_CMD="$RELEASE_CMD dist/checksums.txt"
            RELEASE_CMD="$RELEASE_CMD archlinux/${PACKAGE_FILE}"
            RELEASE_CMD="$RELEASE_CMD archlinux/package-checksums.txt"
            RELEASE_CMD="$RELEASE_CMD debpkg/${DEB_FILE}"
            RELEASE_CMD="$RELEASE_CMD debpkg/${DSC_FILE}"
            RELEASE_CMD="$RELEASE_CMD debpkg/${SRC_FILE}"
            RELEASE_CMD="$RELEASE_CMD debpkg/debian-checksums.txt"

            # Add repository specification to command
            RELEASE_CMD="$RELEASE_CMD --repo ${GH_REPO}"

            # Execute the command
            eval $RELEASE_CMD
          fi

      - name: Release Summary
        run: |
          VERSION=${{ needs.build-binaries.outputs.version }}
          PACKAGE_FILE=${{ steps.package_info.outputs.PACKAGE_FILE }}

          echo "🎉 Release ${VERSION} completed successfully!"
          echo ""
          echo "📦 Artifacts created:"
          echo "  • Linux binary: tpm2-kira-linux-amd64"
          echo "  • Binary checksums: checksums.txt"
          echo "  • Arch Linux package: ${PACKAGE_FILE}"
          echo "  • Package checksums: package-checksums.txt"
          echo "  • Debian package: ${{ steps.package_info.outputs.DEB_FILE }}"
          echo "  • Debian source: ${{ steps.package_info.outputs.SRC_FILE }}"
          echo ""
          echo "🔗 Release URL: https://github.com/mrwiora/tpm2-kira/releases/tag/${VERSION}"
          echo ""
          echo "📊 Artifact sizes:"
          echo "  • Binary: $(du -h dist/tpm2-kira-linux-amd64 | cut -f1)"
          echo "  • Package: $(du -h archlinux/${PACKAGE_FILE} | cut -f1)"
