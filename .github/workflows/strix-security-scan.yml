---
name: Strix AI Penetration Test

permissions:
  contents: read
  pull-requests: write
  issues: write

"on":
  pull_request:
    branches: ["*"]
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan mode (quick or full)'
        required: false
        default: 'quick'
        type: choice
        options:
          - quick
          - full

jobs:
  strix-security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Strix Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          STRIX_REASONING_EFFORT: >-
            ${{
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.scan_mode == 'full' &&
              'high' || 'medium'
            }}
        run: |
          # Determine scan mode
          SCAN_MODE="${{ github.event.inputs.scan_mode || 'quick' }}"

          # Run Strix in non-interactive mode
          strix -n -t ./ --scan-mode ${SCAN_MODE}
        continue-on-error: true

      - name: Upload Strix Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strix-security-report
          path: strix_runs/
          retention-days: 30

      - name: Comment on PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let comment = '## 🔒 Strix AI Penetration Test Results\n\n';

            // Check if strix_runs directory exists
            const strixRunsPath = 'strix_runs';
            if (fs.existsSync(strixRunsPath)) {
              comment += '✅ Security scan completed. ';
              comment +=
                'Review the full report in the workflow artifacts.\n\n';
              comment += '**Note:** The Strix scan has been executed. ';
              comment +=
                'Please review the artifacts for detailed findings.\n';
            } else {
              comment += '⚠️ Security scan completed but ';
              comment += 'no results directory found. ';
              comment += 'Check workflow logs for details.\n';
            }

            comment += '\n---\n';
            comment += '*Automated security testing powered by ';
            comment += '[Strix AI](https://strix.ai)*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
