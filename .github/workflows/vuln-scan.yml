name: Vulnerability Scan

# govulncheck, through tools/vulncheck.py (the known-wrong records are in
# tools/vulncheck-ignore): the source on every push, and the binary of the
# latest release every day, so a vulnerability published after the release
# is seen. A vulnerability counts when the code calls into it.

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  schedule:
    - cron: '0 4 * * *'  # Every day at 4:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan the source
        run: tools/vulncheck.py ./...

  # Not on a push: the asset is the last release, whatever the push changed.
  release-binary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Download latest release binary
        run: |
          gh release download \
            --repo ${{ github.repository }} \
            --pattern "tpm2-kira-linux-amd64" \
            --dir ./bin
          chmod +x ./bin/tpm2-kira-linux-amd64
          go version -m ./bin/tpm2-kira-linux-amd64 | head -3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The binary keeps its symbol table (release.yml builds without -s),
      # so the scan sees the functions it holds, not just the modules.
      - name: Scan the binary
        run: tools/vulncheck.py -mode binary ./bin/tpm2-kira-linux-amd64
