# This workflow builds an Arch Linux package from the PKGBUILD when a new tag is created.
# It runs in an Arch Linux container, builds the package using makepkg, validates it with namcap,
# and uploads the resulting .pkg.tar.zst file to the GitHub release.

name: Build Arch Linux Package

on:
  push:
    tags:
      - "*"

jobs:
  build-archlinux:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write

    steps:
      - name: Update system and install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git go namcap

      - name: Validate Go version
        run: |
          GO_VERSION=$(go version | awk '{print $3}' | sed 's/go//')
          echo "Installed Go version: ${GO_VERSION}"
          # Check if Go version is 1.19 or higher (required by PKGBUILD)
          if ! go version | grep -qE 'go1\.(19|[2-9][0-9]|[3-9][0-9])\.' && ! go version | grep -qE 'go[2-9]\.' ; then
            echo "ERROR: Go version 1.19 or higher required, found ${GO_VERSION}"
            exit 1
          fi
          echo "Go version validation passed"

      - name: Create build user
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix ownership for build user
        run: |
          chown -R builder:builder .

      - name: Verify build environment
        run: |
          echo "Build environment check:"
          echo "- Working directory: $(pwd)"
          echo "- User: $(whoami)"
          echo "- Go version: $(go version)"
          echo "- Git status: $(git status --porcelain | wc -l) modified files"
          echo "- Available disk space: $(df -h . | tail -1 | awk '{print $4}')"
          ls -la packaging/archlinux/

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present
          VERSION_CLEAN=${VERSION#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_CLEAN=${VERSION_CLEAN}" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD version
        run: |
          cd packaging/archlinux
          echo "Updating PKGBUILD version to ${{ steps.get_version.outputs.VERSION_CLEAN }}"
          sed -i "s/pkgver=0.0.0/pkgver=${{ steps.get_version.outputs.VERSION_CLEAN }}/" PKGBUILD
          # Verify the version was updated
          if ! grep -q "pkgver=${{ steps.get_version.outputs.VERSION_CLEAN }}" PKGBUILD; then
            echo "ERROR: Failed to update PKGBUILD version"
            exit 1
          fi
          echo "PKGBUILD version updated successfully"

      - name: Build package
        run: |
          cd packaging/archlinux
          echo "Starting package build..."
          sudo -u builder makepkg --noconfirm --syncdeps --rmdeps --clean

          # Verify package was created
          if ! ls *.pkg.tar.zst >/dev/null 2>&1; then
            echo "ERROR: No package file was created"
            exit 1
          fi
          echo "Package build completed successfully"

      - name: Check package with namcap
        run: |
          cd packaging/archlinux
          echo "Running namcap package validation..."
          namcap *.pkg.tar.zst || echo "namcap warnings/errors detected (non-fatal)"

      - name: Validate package contents
        run: |
          cd packaging/archlinux
          echo "Validating package contents..."

          # Extract package contents for validation
          mkdir -p /tmp/package-test
          tar -xf *.pkg.tar.zst -C /tmp/package-test

          # Check if binary exists and is executable
          if [[ ! -x "/tmp/package-test/usr/bin/tpm2-kira" ]]; then
            echo "ERROR: tpm2-kira binary not found or not executable"
            exit 1
          fi

          # Check if binary reports correct version
          VERSION_CLEAN=${{ steps.get_version.outputs.VERSION_CLEAN }}
          BINARY_VERSION=$(/tmp/package-test/usr/bin/tpm2-kira version 2>/dev/null | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' || echo "unknown")

          if [[ "${BINARY_VERSION}" != "${VERSION_CLEAN}" ]]; then
            echo "WARNING: Binary version mismatch - expected ${VERSION_CLEAN}, got ${BINARY_VERSION}"
          else
            echo "✓ Binary version matches tag: ${BINARY_VERSION}"
          fi

          # Check essential files are present
          REQUIRED_FILES=(
            "usr/bin/tpm2-kira"
            "usr/share/doc/tpm2-kira/README.md"
            "usr/share/licenses/tpm2-kira/LICENSE"
            "usr/lib/systemd/system/tpm2-kira.service"
            "usr/lib/initcpio/install/sd-tpm2-kira"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "/tmp/package-test/${file}" ]]; then
              echo "ERROR: Required file missing: ${file}"
              exit 1
            else
              echo "✓ Found: ${file}"
            fi
          done

          echo "Package validation completed successfully"

      - name: Get package filename
        id: package_info
        run: |
          cd packaging/archlinux
          PACKAGE_FILE=$(ls *.pkg.tar.zst)
          echo "PACKAGE_FILE=${PACKAGE_FILE}" >> $GITHUB_OUTPUT
          echo "Package built: ${PACKAGE_FILE}"

      - name: Create package checksum
        run: |
          cd packaging/archlinux
          sha256sum *.pkg.tar.zst > package-checksums.txt
          cat package-checksums.txt

      - name: Upload package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          PACKAGE_FILE=${{ steps.package_info.outputs.PACKAGE_FILE }}

          cd packaging/archlinux

          # Verify files exist before upload
          if [[ ! -f "${PACKAGE_FILE}" ]]; then
            echo "ERROR: Package file ${PACKAGE_FILE} not found"
            exit 1
          fi

          if [[ ! -f "package-checksums.txt" ]]; then
            echo "ERROR: Checksums file not found"
            exit 1
          fi

          echo "Uploading package: ${PACKAGE_FILE}"
          echo "Package size: $(du -h ${PACKAGE_FILE} | cut -f1)"

          # Check if release exists
          if gh release view ${VERSION} >/dev/null 2>&1; then
            echo "Release ${VERSION} exists, uploading Arch Linux package..."

            # Upload package and checksums to existing release
            gh release upload ${VERSION} ${PACKAGE_FILE} --clobber
            gh release upload ${VERSION} package-checksums.txt --clobber

            echo "Arch Linux package uploaded to existing release ${VERSION}"

            # Add release notes about Arch Linux package (append to existing notes)
            EXISTING_NOTES=$(gh release view ${VERSION} --json body -q .body || echo "")
            gh release edit ${VERSION} --notes <(cat <<EOF
${EXISTING_NOTES}

## Arch Linux Package

This release includes a pre-built Arch Linux package:
- **Package**: \`${PACKAGE_FILE}\`
- **Installation**: \`sudo pacman -U ${PACKAGE_FILE}\`
- **Dependencies**: tpm2-tools>=5.0, tpm2-tss>=3.0.0

### Installation from Release
\`\`\`bash
# Download the package
wget https://github.com/mrwiora/tpm2-kira/releases/download/${VERSION}/${PACKAGE_FILE}

# Verify checksum (optional but recommended)
wget https://github.com/mrwiora/tpm2-kira/releases/download/${VERSION}/package-checksums.txt
sha256sum -c package-checksums.txt

# Install the package
sudo pacman -U ${PACKAGE_FILE}
\`\`\`

For build from source instructions, see README.md.
EOF
            ) || echo "Failed to update release notes (non-fatal)"
          else
            echo "Release ${VERSION} does not exist, creating new release with Arch Linux package..."

            # Create release notes
            cat > release_notes.md <<EOF
## Release ${VERSION}

### Arch Linux Package

This release includes a pre-built Arch Linux package:
- **Package**: \`${PACKAGE_FILE}\`
- **Installation**: \`sudo pacman -U ${PACKAGE_FILE}\`
- **Dependencies**: tpm2-tools>=5.0, tpm2-tss>=3.0.0

### Installation
\`\`\`bash
# Download the package
wget https://github.com/mrwiora/tpm2-kira/releases/download/${VERSION}/${PACKAGE_FILE}

# Install the package
sudo pacman -U ${PACKAGE_FILE}
\`\`\`

For build from source instructions, see README.md.
EOF

            # Create release command
            RELEASE_CMD="gh release create ${VERSION} --title \"Release ${VERSION}\" --notes-file release_notes.md"

            # Add prerelease flag if version contains dash
            if [[ "$VERSION" == *"-"* ]]; then
              RELEASE_CMD="$RELEASE_CMD --prerelease"
              echo "Adding prerelease flag for version ${VERSION}"
            fi

            # Add package and checksums
            RELEASE_CMD="$RELEASE_CMD ${PACKAGE_FILE}"
            RELEASE_CMD="$RELEASE_CMD package-checksums.txt"

            # Execute the command
            eval $RELEASE_CMD

            echo "New release ${VERSION} created with Arch Linux package"
          fi

          echo "Build and upload completed successfully!"
          echo "Package info:"
          echo "  - Version: ${VERSION}"
          echo "  - File: ${PACKAGE_FILE}"
          echo "  - Size: $(du -h ${PACKAGE_FILE} | cut -f1)"
          echo "  - SHA256: $(sha256sum ${PACKAGE_FILE} | cut -d' ' -f1)"

      - name: Store build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: archlinux-package-${{ steps.get_version.outputs.VERSION_CLEAN }}
          path: |
            packaging/archlinux/*.pkg.tar.zst
            packaging/archlinux/package-checksums.txt
          retention-days: 30
