# Advanced CodeQL Security Scan Configuration
#
# IMPORTANT: This workflow requires GitHub's default CodeQL setup to be DISABLED.
# If you encounter an error like:
#   "CodeQL analyses from advanced configurations cannot be processed when the default setup is enabled"
# 
# Please follow the instructions in .github/CODEQL_SETUP.md to switch to advanced setup.
#
# This configuration uses extended security queries for comprehensive analysis.

name: "CodeQL Security Scan"

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    # Run at 00:00 UTC every Monday
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze Code Security
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Check CodeQL Configuration
      run: |
        echo "================================================================"
        echo "⚠️  Advanced CodeQL Security Scan - CONFIGURATION REQUIRED"
        echo "================================================================"
        echo ""
        echo "⚠️  IMPORTANT: This workflow requires manual configuration!"
        echo ""
        echo "The workflow is currently FAILING because GitHub's default"
        echo "CodeQL setup is STILL ENABLED in repository settings."
        echo ""
        echo "✅ TO FIX THIS ERROR:"
        echo "   1. Go to: Settings → Code security and analysis"
        echo "   2. Find: CodeQL analysis section"
        echo "   3. Click: ⋯ (three dots) → 'Switch to advanced' or 'Disable'"
        echo ""
        echo "📖 For detailed instructions, see: .github/CODEQL_SETUP.md"
        echo ""
        echo "This workflow uses custom CodeQL queries for enhanced security:"
        echo "  • security-extended - Additional vulnerability checks"
        echo "  • security-and-quality - Code quality analysis"
        echo ""
        echo "⚠️  Until default setup is disabled, this workflow will fail!"
        echo "================================================================"
        echo ""

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Enable all security queries including GraphQL-related checks
        queries: security-extended,security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
