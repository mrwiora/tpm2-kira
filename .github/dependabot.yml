version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    # The golang.org/x modules included: they raise go.mod's go line to the
    # Go before the current one at most, and the builds use the current one
    # anyway (see .github/actions/go-latest).

  # The actions the workflows use: a major behind means the deprecated
  # Node runtime, and the warning in every job's log.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
