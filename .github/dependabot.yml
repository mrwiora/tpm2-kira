version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    # The golang.org/x modules included: go.mod's go line is the current
    # Go release (the Go line itself is bumped by hand, with every Go
    # release), so their requirement never runs ahead of it.

  # The actions the workflows use: a major behind means the deprecated
  # Node runtime, and the warning in every job's log.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
