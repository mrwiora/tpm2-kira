version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # The golang.org/x modules ask for the Go before the current one with
      # every release, and go.mod requires only the Go the code needs (the
      # build itself uses the current Go). They are bumped by hand when the
      # required Go moves anyway.
      - dependency-name: "golang.org/x/*"
