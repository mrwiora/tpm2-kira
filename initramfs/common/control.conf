# /etc/tpm2-kira/control.conf - the one configuration file of tpm2-kira.
# 'tpm2-kira control' sets what is here; the other commands only read it.
# The initramfs hooks copy it into the initramfs: rebuild it after a change
# (sudo mkinitcpio -P / sudo update-initramfs -u); on Arch the post hook
# reseals afterwards, on Debian run 'sudo tpm2-kira reseal' if needed.

# How the disk's key is made when it is asked for at boot (the key socket
# on Arch, the cryptsetup keyscript on Debian).
#
#   skip                 tpm2-kira stays out of it: cryptsetup's own prompt
#                        asks for the LUKS passphrase (default)
#   password+salt        tpm2-kira asks for a password and a salt and hands
#                        over hashpwd2's derivation of the two (Argon2id,
#                        1 GiB of memory, some seconds): the key of a keyslot
#                        made with 'tpm2-kira luks enrol --mode password+salt'
#                        (or with hashpwd2 and luksAddKey by hand)
#   password+remotesalt  tpm2-kira asks for the password; the salt is the
#                        one the verifier (the phone) released in this boot
#                        and the TPM opened. Without a released salt, the
#                        typed-salt variant, then cryptsetup's own prompt
#
# In every mode a wrong answer, or Ctrl-C at tpm2-kira's prompt, falls back
# to cryptsetup's own prompt, where the recovery passphrase works.
TPM2_KIRA_UNLOCK=skip

# Remote attestation over Bluetooth LE at the code screen: the radio.
# A phone is served whenever one is enrolled ('tpm2-kira attest enrol'); the
# hooks then add the adapter below, and 'tpm2-kira attest gate' serves it
# at boot beside the TOTP code. The boot is never held. Without an enrolled
# phone nothing of this is used.

# Bluetooth adapter (hciN) to use. The hooks copy the driver modules and the
# firmware this adapter loaded on the build machine, and nothing else.
TPM2_KIRA_ATTEST_ADAPTER=0

# Seconds to wait for a phone; 0 waits as long as the code screen is up
# (its hold, 90 s by default), which ends the phone check in any case.
TPM2_KIRA_ATTEST_TIMEOUT=0

# Seconds to wait for the adapter to appear (module and firmware loading).
TPM2_KIRA_ATTEST_ADAPTER_WAIT=30

# 0: the gate's narrative (waiting, a phone connected, the verdict) goes
# to the journal only, never to the console, where the code screen shows
# the gate's state; read it after the boot with
#   journalctl -b -u tpm2-kira-attest.service -u tpm2-kira.service
# (Debian: /run/initramfs/tpm2-kira.log). Failures reach the console.
# 1: the gate logs every step it takes (TPM, adapter, controller commands,
# advertising, connections), and the narrative appears on the console too,
# between the code screen and the prompts.
TPM2_KIRA_ATTEST_DEBUG=0
