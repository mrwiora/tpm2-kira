# /etc/tpm2-kira/control.conf - the one configuration file of tpm2-kira.
# 'tpm2-kira control' sets what is here; the other commands only read it.
# The file itself never goes into the boot image; the network and SSH
# settings below are turned into files of the image when it is built:
# rebuild it after changing them (sudo mkinitcpio -P; the post hook reseals).

# How the disk's key is made is not configured here: the key provider
# reads each volume's own LUKS2 header at boot - the tpm2-kira token of a
# keyslot says whether the key is the typed passphrase's derivation
# (password+salt) or needs the salt the phone returns
# (password+remotesalt). A wrong answer, or Ctrl-C at tpm2-kira's prompt,
# falls back to cryptsetup's own prompt, where the recovery passphrase
# works.

# The YubiKey's PIN for the unattended reseal is not here: control keeps
# it in /etc/tpm2-kira/pin, root's alone. This file holds what the boot
# image is built with and nothing else: changed, the image is out of date.

# Remote attestation over Bluetooth LE at the code screen: which adapter
# goes into the boot image, and when. A phone is served whenever one is
# enrolled ('tpm2-kira attest enrol'); the hooks then add the adapter below,
# and 'tpm2-kira attest gate' serves it at boot beside the code screen. The
# boot is never held.
#
# Nothing of this file goes into the boot image. The gate there takes the
# adapter that comes up (the image carries this one's driver alone) and
# waits for it and for a phone as long as the code screen holds. To see
# every step it takes (TPM, adapter, controller commands, advertising,
# connections) on the console, switch "Debug at boot" on in 'tpm2-kira
# control' (a setting in the TPM, no rebuild); without it the narrative goes
# to the journal only:
#   journalctl -b -u tpm2-kira-attest.service -u tpm2-kira.service
# (Debian: /run/initramfs/tpm2-kira.log). Failures reach the console.

# Bluetooth adapter (hciN) whose driver modules and firmware the boot plan
# puts into the image, and nothing else.
TPM2_KIRA_ATTEST_ADAPTER=0

# auto: the boot plan adds Bluetooth to the image once a phone is enrolled.
# always: Bluetooth is packed into every image (~1.1 MB) - on a machine with
# a TPM and the signing key, which the gate needs - so enrolling and
# removing phones never changes the image - rebuild once after setting it,
# and the first enrolment causes no "changed" verdict at the next boot.
TPM2_KIRA_ATTEST_BLUETOOTH=auto


# Network and SSH in the boot image (docs/SSH.md); both off unless
# set here. Set for the image alone: /etc/systemd/network and
# /etc/network/interfaces configure the running system and are only read
# by 'tpm2-kira control' for a suggestion.
#
# off: no network in the image. dhcp, or static with the address below.
#TPM2_KIRA_NET=off
# The interface: its MAC address (safest: the image may name interfaces
# differently) or its name. Empty: every wired interface (DHCP only).
#TPM2_KIRA_NET_MATCH=aa:bb:cc:dd:ee:ff
# static only: addresses with their prefix, and gateways; several are
# separated by spaces, in quotes.
#TPM2_KIRA_NET_ADDRESS="192.0.2.10/24 2001:db8::10/64"
#TPM2_KIRA_NET_GATEWAY=192.0.2.1
#TPM2_KIRA_NET_DNS="192.0.2.53"
#
# on: tpm2-kira runs its own SSH server with the code screen, as nobody,
# without file access; it holds no key and no password. The codes are shown and confirmed in an SSH session (log in as root),
# the password is typed there; the console says where to log in, and
# Enter at the console continues there instead (the SSH server stops).
#TPM2_KIRA_SSH=off
#TPM2_KIRA_SSH_PORT=22
# Seconds the boot waits for the confirmation; 0: until it comes.
#TPM2_KIRA_SSH_HOLD=0
# The keys that may log in are in /etc/tpm2-kira/authorized_keys, no
# setting: tpm2-kira's own file, root's keys copied there by control when
# asked (any kind OpenSSH has; a line with options in front of the key is
# left out, as they are not honoured). The boot plan names the sum of the
# keys the image holds, so control sees when the file differs.
# The host key: none is stored. At every boot the TPM makes one and the
# SSH CA in the TPM certifies it - /etc/tpm2-kira/ssh_ca.json, no setting,
# created by control, signing only while PCR 0 (firmware) and PCR 7
# (Secure Boot) hold values the signing key approved. Clients trust the
# CA once: '@cert-authority <names> <ssh_ca.json.pub>' in known_hosts.
