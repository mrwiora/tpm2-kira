# How tpm2-kira answers when the disk asks for its key at boot (the key
# socket on Arch, the cryptsetup keyscript on Debian). Copied into the
# initramfs by the hooks; rebuild it after a change.
#
#   passphrase  ask for the passphrase and hand it over as typed (default)
#   hashpwd2    ask for a password and a salt and hand over hashpwd2's
#               derivation of the two (Argon2id, 1 GiB of memory, some
#               seconds): the key a keyslot enrolled with hashpwd2, or with
#               'tpm2-kira derive', opens with. When the phone released the
#               disk factor, the factor is the salt and only the password
#               is asked for.
#
# Either way a wrong answer falls back to cryptsetup's own prompt, where
# the recovery passphrase works.
TPM2_KIRA_UNLOCK=passphrase
