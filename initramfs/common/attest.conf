# Remote attestation over Bluetooth LE at the passphrase prompt.
#
# Read by the initramfs hooks when the image is built, and by
# 'tpm2-kira attest gate' at boot. Rebuild the initramfs after a change
# (sudo mkinitcpio -P  /  sudo update-initramfs -u); on Arch the post hook
# reseals afterwards, on Debian run 'sudo tpm2-kira reseal' if needed.
#
#   off   no radio, no advertising: exactly the TOTP-only behaviour (default)
#   lazy  bring the adapter up, advertise and serve attestation requests from
#         an enrolled phone. The verdict is shown on the console; the boot and
#         the passphrase prompt are never held. The TOTP code is still shown.
#
# Enrol a phone first: sudo tpm2-kira attest enrol
TPM2_KIRA_ATTEST=off

# Bluetooth adapter (hciN) to use. The hooks copy the driver modules and the
# firmware this adapter loaded on the build machine, and nothing else.
TPM2_KIRA_ATTEST_ADAPTER=0

# Seconds to wait for a phone; 0 keeps waiting until the initramfs ends.
TPM2_KIRA_ATTEST_TIMEOUT=0

# Seconds to wait for the adapter to appear (module and firmware loading).
TPM2_KIRA_ATTEST_ADAPTER_WAIT=30

# 1: the gate logs every step it takes (TPM, adapter, controller commands,
# advertising, connections). Read it after the boot with
#   journalctl -b -u tpm2-kira-attest.service
# The lines also appear on the console, between the passphrase prompts.
# Rebuild the initramfs after changing this file.
TPM2_KIRA_ATTEST_DEBUG=0
