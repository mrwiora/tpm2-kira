# bootctl update changed the boot loader on the EFI system partition, which the
# firmware measures into PCR 4 at the next boot: approve it, if it did. Never a
# failure of the update: without the signing key (a YubiKey not plugged in) the
# slots keep their approvals, and status names what is due.
[Service]
ExecStartPost=-/usr/bin/tpm2-kira slot approve --if-moved
